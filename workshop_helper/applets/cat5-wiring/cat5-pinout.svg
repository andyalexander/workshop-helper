<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560"
     role="img" aria-label="RJ45 pin one to eight conductor colours for the T568B and T568A wiring standards, drawn as two plugs viewed with the latch away from the eye and pin one on the left.">
  <title>Cat5/Cat5e RJ45 pinout &#8212; T568B and T568A conductor colours</title>

  <defs>
    <!-- A striped conductor is white with the pair colour spiralled round it,
         which reads as angled bands end-on. One pattern per striped wire. -->
    <pattern id="s-orange" width="18" height="18" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-35)">
      <rect width="18" height="18" fill="#ffffff" />
      <rect width="18" height="8" fill="#e8720c" />
    </pattern>
    <pattern id="s-green" width="18" height="18" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-35)">
      <rect width="18" height="18" fill="#ffffff" />
      <rect width="18" height="8" fill="#1e7d32" />
    </pattern>
    <pattern id="s-blue" width="18" height="18" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-35)">
      <rect width="18" height="18" fill="#ffffff" />
      <rect width="18" height="8" fill="#1257a8" />
    </pattern>
    <pattern id="s-brown" width="18" height="18" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-35)">
      <rect width="18" height="18" fill="#ffffff" />
      <rect width="18" height="8" fill="#6d4c41" />
    </pattern>
  </defs>

  <g font-family="system-ui, sans-serif">

    <!-- ================= T568B ================= -->
    <g transform="translate(0,0)">
      <text x="38" y="28" font-size="16" font-weight="600" fill="#1c1c1c">T568B</text>
      <text x="104" y="28" font-size="13" fill="#5d5d5d">&#8212; the common default in the UK</text>

      <!-- plug body, latch on the far side, so pin 1 is on the left -->
      <path d="M180,44 h36 v14 h-36 z" fill="none" stroke="#1c1c1c" stroke-width="2" />
      <rect x="38" y="58" width="320" height="106" rx="6"
            fill="none" stroke="#1c1c1c" stroke-width="2" />

      <g stroke="#8a8580" stroke-width="1">
        <rect x="44"  y="64" width="34" height="94" fill="url(#s-orange)" />
        <rect x="83"  y="64" width="34" height="94" fill="#e8720c" />
        <rect x="122" y="64" width="34" height="94" fill="url(#s-green)" />
        <rect x="161" y="64" width="34" height="94" fill="#1257a8" />
        <rect x="200" y="64" width="34" height="94" fill="url(#s-blue)" />
        <rect x="239" y="64" width="34" height="94" fill="#1e7d32" />
        <rect x="278" y="64" width="34" height="94" fill="url(#s-brown)" />
        <rect x="317" y="64" width="34" height="94" fill="#6d4c41" />
      </g>

      <g font-size="13" font-weight="600" fill="#1c1c1c" text-anchor="middle">
        <text x="61"  y="184">1</text>
        <text x="100" y="184">2</text>
        <text x="139" y="184">3</text>
        <text x="178" y="184">4</text>
        <text x="217" y="184">5</text>
        <text x="256" y="184">6</text>
        <text x="295" y="184">7</text>
        <text x="334" y="184">8</text>
      </g>
      <g font-size="11" fill="#5d5d5d" text-anchor="middle">
        <text x="61"  y="200">wh/or</text>
        <text x="100" y="200">or</text>
        <text x="139" y="200">wh/gn</text>
        <text x="178" y="200">bl</text>
        <text x="217" y="200">wh/bl</text>
        <text x="256" y="200">gn</text>
        <text x="295" y="200">wh/br</text>
        <text x="334" y="200">br</text>
      </g>

      <!-- pair brackets: 4/5 blue sit inside the split 3/6 green pair -->
      <g fill="none" stroke="#8a8580" stroke-width="1">
        <path d="M46,212 v8 h69 v-8" />
        <path d="M124,236 v14 h147 v-14" />
        <path d="M163,212 v8 h69 v-8" />
        <path d="M280,212 v8 h69 v-8" />
      </g>
      <g font-size="11" fill="#5d5d5d" text-anchor="middle">
        <text x="80"  y="232">pair 2 orange</text>
        <text x="197" y="232">pair 1 blue</text>
        <text x="314" y="232">pair 4 brown</text>
        <text x="197" y="262">pair 3 green &#8212; split across 3 and 6</text>
      </g>
    </g>

    <!-- ================= T568A ================= -->
    <g transform="translate(0,278)">
      <text x="38" y="28" font-size="16" font-weight="600" fill="#1c1c1c">T568A</text>
      <text x="104" y="28" font-size="13" fill="#5d5d5d">&#8212; orange and green pairs swapped</text>

      <path d="M180,44 h36 v14 h-36 z" fill="none" stroke="#1c1c1c" stroke-width="2" />
      <rect x="38" y="58" width="320" height="106" rx="6"
            fill="none" stroke="#1c1c1c" stroke-width="2" />

      <g stroke="#8a8580" stroke-width="1">
        <rect x="44"  y="64" width="34" height="94" fill="url(#s-green)" />
        <rect x="83"  y="64" width="34" height="94" fill="#1e7d32" />
        <rect x="122" y="64" width="34" height="94" fill="url(#s-orange)" />
        <rect x="161" y="64" width="34" height="94" fill="#1257a8" />
        <rect x="200" y="64" width="34" height="94" fill="url(#s-blue)" />
        <rect x="239" y="64" width="34" height="94" fill="#e8720c" />
        <rect x="278" y="64" width="34" height="94" fill="url(#s-brown)" />
        <rect x="317" y="64" width="34" height="94" fill="#6d4c41" />
      </g>

      <g font-size="13" font-weight="600" fill="#1c1c1c" text-anchor="middle">
        <text x="61"  y="184">1</text>
        <text x="100" y="184">2</text>
        <text x="139" y="184">3</text>
        <text x="178" y="184">4</text>
        <text x="217" y="184">5</text>
        <text x="256" y="184">6</text>
        <text x="295" y="184">7</text>
        <text x="334" y="184">8</text>
      </g>
      <g font-size="11" fill="#5d5d5d" text-anchor="middle">
        <text x="61"  y="200">wh/gn</text>
        <text x="100" y="200">gn</text>
        <text x="139" y="200">wh/or</text>
        <text x="178" y="200">bl</text>
        <text x="217" y="200">wh/bl</text>
        <text x="256" y="200">or</text>
        <text x="295" y="200">wh/br</text>
        <text x="334" y="200">br</text>
      </g>
    </g>

    <!-- orientation note, which is the half of a pinout people get wrong -->
    <g font-size="12" fill="#5d5d5d">
      <text x="390" y="80">Latch away from you,</text>
      <text x="390" y="98">contacts towards you,</text>
      <text x="390" y="116">pin 1 on the left.</text>
      <text x="390" y="146">Both ends the same</text>
      <text x="390" y="164">standard = straight</text>
      <text x="390" y="182">through. That is the</text>
      <text x="390" y="200">lead you want.</text>
    </g>

    <text x="38" y="512" font-size="11" fill="#8a8580">
      Schematic. Conductor stripes are drawn angled; a real wire is spiralled.
    </text>
  </g>
</svg>
