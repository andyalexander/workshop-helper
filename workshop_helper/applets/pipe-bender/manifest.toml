# Top-level keys come first — TOML's own scoping rule (spec §4.5). Written below
# the first table header, `default_mode` would parse as a key of *that* table:
# valid TOML, no error, and an Applet that silently opens on the wrong mode. The
# Host rejects unrecognised keys inside [inputs.*], [modes.*] and
# [calibration.values.*] because that is the only thing standing between this
# mistake and a mis-cut pipe.
default_mode = "single_bend"

[applet]
type        = "calculator"
name        = "Pipe bender"
description = "Setback and offset marks for a lever bender, from your own former."
author      = "andy"
tags        = ["plumbing", "copper", "pipe-bending"]

# --- The Input pool: every Input this Applet can use, declared once (§4.3). ---

# Only the sizes with a *measured* former. 28mm is deliberately absent: nobody
# has measured one, and deriving it from the other two would be a guess wearing
# a measurement's clothes (§1.2, §5.3 rule 3).
[inputs.size]
kind    = "choice"
label   = "Pipe size"
choices = ["15mm", "22mm"]
default = "15mm"

[inputs.angle]
kind    = "number"
label   = "Bend angle"
unit    = "°"
# The former stops at 90°, and `min` keeps θ = 0 — an unbent pipe, whose offset
# multiplier is infinite — out of compute() rather than into it (§4.3).
min     = 1
max     = 90
step    = 1
default = 45

[inputs.offset]
kind    = "number"
label   = "Step (offset between the legs)"
unit    = "mm"
min     = 1
default = 100

# --- Calibration: measured off the benders in *this* workshop (§5). ---
#
# Both figures are measured, on the owner's own two benders, to the centreline
# (#17, #22). The Host resolves the slice for the selected size and hands
# compute() a flat dict; the user corrects these in the Overlay, never here.
[calibration]
keyed_by = "size"

[calibration.values.15mm]
r_centreline = 70.0

[calibration.values.22mm]
r_centreline = 110.0

# --- The modes: each names its own Inputs and its own Outputs (§4.5). ---

[modes.single_bend]
label   = "Single bend"
inputs  = ["size", "angle"]
outputs = [
  { name = "setback",      label = "Setback, to the vertex of the centrelines", unit = "mm", primary = true },
  { name = "r_centreline", label = "Former radius (centreline)",                unit = "mm" },
]

# The headline changes with the mode because each mode names its own primary.
[modes.step]
label   = "Step (offset)"
inputs  = ["size", "angle", "offset"]
outputs = [
  { name = "mark_distance", label = "Distance between marks, on straight pipe", unit = "mm", primary = true },
  { name = "gain",          label = "Gain, per bend",                           unit = "mm" },
  # Named for what it is. The geometric floor is where the *geometry* stops; the
  # bender runs out of grip well before that, and the two are not the same number
  # (see applet.py).
  { name = "min_step",      label = "Smallest step the geometry allows",        unit = "mm" },
]
